<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Menu MBG</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef7f0;color:#173b24}
.box{max-width:700px;margin:auto;padding:15px}
.header{background:#16843b;color:white;text-align:center;padding:22px;border-radius:18px}
.logo{width:75px;height:75px;background:white;color:#16843b;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto;font-weight:bold;font-size:22px;border:4px solid #ffd43b}
.card{background:white;padding:18px;margin-top:15px;border-radius:16px;box-shadow:0 3px 12px #0002}
label{display:block;font-weight:bold;margin-top:12px}
input,textarea{width:100%;padding:13px;margin-top:6px;border:1px solid #ccc;border-radius:10px;font-size:16px}
textarea{min-height:100px}
button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:12px;background:#16843b;color:white;font-size:17px;font-weight:bold}
.info{background:#fff3cd;padding:12px;border-radius:10px;margin-top:15px}
</style>
</head>

<body>
<div class="box">

<div class="header">
<div class="logo">MBG</div>
<h2>ADMIN MENU MBG</h2>
<div>SPPG Nganjuk Loceret Candirejo</div>
</div>

<div class="card">

<label>Tanggal</label>
<input type="date" id="tanggal">

<label>Menu Makanan</label>
<textarea id="menu" placeholder="Contoh:
Nasi Putih
Ayam
Sayur
Buah"></textarea>

<label>Energi</label>
<input id="energi" placeholder="Contoh: 650 kkal">

<label>Protein</label>
<input id="protein" placeholder="Contoh: 25 gram">

<label>Lemak</label>
<input id="lemak" placeholder="Contoh: 20 gram">

<label>Kharbo</label>
<input id="kharbo" placeholder="Contoh: 80 gram">

<label>Serat</label>
<input id="serat" placeholder="Contoh: 8 gram">

<label>Porsi Balita</label>
<input id="balita">

<label>Porsi Kecil</label>
<input id="kecil">

<label>Porsi Besar</label>
<input id="besar">

<label>Porsi Bumil & Busui</label>
<input id="bumil">

<button onclick="simpan()">💾 SIMPAN MENU</button>

<div class="info">
Setelah sistem database disambungkan, data yang disimpan di sini akan tampil pada halaman QR yang sama.
</div>

</div>

</div>

<script>
document.getElementById("tanggal").value =
new Date().toISOString().split("T")[0];

function simpan(){
const data={
tanggal:document.getElementById("tanggal").value,
menu:document.getElementById("menu").value,
energi:document.getElementById("energi").value,
protein:document.getElementById("protein").value,
lemak:document.getElementById("lemak").value,
kharbo:document.getElementById("kharbo").value,
serat:document.getElementById("serat").value,
balita:document.getElementById("balita").value,
kecil:document.getElementById("kecil").value,
besar:document.getElementById("besar").value,
bumil:document.getElementById("bumil").value
};

localStorage.setItem("MBG_MENU",JSON.stringify(data));
alert("Menu tersimpan.");
}
</script>

</body>
</html>
